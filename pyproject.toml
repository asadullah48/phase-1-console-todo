[project]
name = "phase-1-console-todo"
version = "1.0.0"
description = "Clean-architecture console todo application - Phase I of a five-phase build"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Asadullah Shafique" }]
keywords = ["clean-architecture", "repository-pattern", "todo", "console"]

# Deliberately empty: every import in src/ is standard library. The repository
# pattern is what makes that possible - storage is an interface, so Phase I is
# a complete runnable application with no database driver.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
phase1-todo = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The source imports `from src.domain...`, so the repo root must be importable.
pythonpath = ["."]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
